<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stack Mini Play</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f1221;
      }
      #view {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        color: #e6edf3;
        font-family: Arial, sans-serif;
      }
      .tower {
        width: 120px;
        min-height: 40px;
        border: 1px solid #39414d;
        display: flex;
        flex-direction: column-reverse;
        align-items: center;
        padding: 8px;
        gap: 4px;
      }
      .block {
        width: 88px;
        height: 18px;
        border-radius: 4px;
        background: #4dc3ff;
      }
      button {
        margin-top: 10px;
        padding: 6px 10px;
      }
    </style>
  </head>
  <body>
    <div id="view">
      <div>
        <h3>Stack Demo</h3>
        <div class="tower" id="tower"></div>
        <button id="dropBtn">Drop Block</button>
      </div>
    </div>
    <script>
      const tower = document.getElementById("tower");
      const dropBtn = document.getElementById("dropBtn");
      let count = 0;

      dropBtn.addEventListener("click", () => {
        const block = document.createElement("div");
        block.className = "block";
        block.style.opacity = String(0.6 + Math.random() * 0.4);
        tower.appendChild(block);
        count += 1;
        if (count > 12) {
          tower.innerHTML = "";
          count = 0;
        }
      });
    </script>
  </body>
</html>
